# Release build, signing, attestation, and publication for Wordwright.
#
# Runs on the PUBLIC repo (github.com/matthewriley/wordwright) — this file is
# published there by publish/publish.sh. The private repo has no Actions.
#
# Triggers:
#   - push of a v* tag: full signed release (build -> sign -> notarize ->
#     attest -> draft release -> publish)
#   - workflow_dispatch from main: dry run. `sign` turns signing/notarization
#     on; `create_release` creates and publishes a GitHub release (tag refs
#     only). Neither is needed to validate the build matrix.
#
# Ordering that must not change (specs 004/007):
#   build -> sign/notarize -> attest the SIGNED files -> upload.
# The Windows ZIPs are built from the already-signed installer and then
# Tauri-signed, so the updater never ships an unsigned exe.
#
# Artifacts are staged in `release-dist/`, never `dist/`: `dist` is the
# Vite output directory, so a build leaves index.html and assets/ there and
# they would be uploaded alongside the installers (caught in Stage 2 —
# `gh release upload ... dist/*/*` would then try to upload a directory).
#
# Required environment `release` secrets (Stage 3):
#   APPLE_CERTIFICATE_P12_B64   Developer ID .p12, base64, no line wraps
#   APPLE_CERTIFICATE_PASSWORD  .p12 export password
#   APPLE_API_KEY_P8_B64        App Store Connect API key .p8, base64
#   APPLE_API_KEY_ID            API key ID
#   APPLE_API_ISSUER            API key issuer UUID
#   TAURI_SIGNING_PRIVATE_KEY   contents of ~/.tauri/wordwright.key
#   AZURE_CLIENT_ID             service principal (OIDC federated credential)
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#
# Actions are pinned by commit SHA (spec 007).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and notarize (requires the release environment secrets)"
        type: boolean
        default: false
      create_release:
        description: "Create and publish a GitHub release (tag refs only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APPLE_SIGNING_IDENTITY: "Developer ID Application: MATTHEW WARREN RILEY (7A5V462NL5)"
  AZURE_TS_ENDPOINT: "https://wus3.codesigning.azure.net/"
  AZURE_TS_ACCOUNT: "wordwright-signing"
  AZURE_TS_PROFILE: "wordwright-public"

jobs:
  guard:
    name: Version and tag guard
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify package.json == tauri.conf.json == Cargo.toml == tag
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          test "$(jq -r .version src-tauri/tauri.conf.json)" = "$version"
          grep -q "^version = \"$version\"\$" src-tauri/Cargo.toml
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (arm64) build, sign, notarize
    needs: guard
    # Runs on tag pushes and on main dispatches. Whether signing happens is
    # a separate gate (env.SIGNING) — an unsigned dispatch still exercises
    # the build, patch, and packaging path. Dispatch is limited to main so
    # the release environment's deployment policy stays narrow.
    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SIGNING: ${{ github.event_name == 'push' || inputs.sign }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Developer ID certificate
        if: env.SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12_B64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning

      - name: Build (signed)
        if: env.SIGNING == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >-
          npm run tauri build --
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Build (unsigned dry run)
        if: env.SIGNING != 'true'
        env:
          # Tauri's APPLE_SIGNING_IDENTITY env var wins over the config
          # value, so the workflow-level Developer ID has to be overridden
          # here too, not just in --config. Without this the dry run tries
          # to sign with a certificate no runner has.
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          npm run tauri build --
          --config '{"bundle":{"macOS":{"signingIdentity":"-"},"createUpdaterArtifacts":false}}'

      - name: Patch document type/icon and re-sign the app
        env:
          SIGNING_IDENTITY: ${{ env.SIGNING == 'true' && env.APPLE_SIGNING_IDENTITY || '-' }}
        run: npm run build:macos-doc-icon

      - name: Notarize and staple the app
        if: env.SIGNING == 'true'
        env:
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        working-directory: src-tauri/target/release/bundle/macos
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8_B64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent Wordwright.app Wordwright.zip
          xcrun notarytool submit Wordwright.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json \
            > "$RUNNER_TEMP/notary-app.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-app.json"
          xcrun stapler staple Wordwright.app
          xcrun stapler validate Wordwright.app

      - name: Repack and re-sign the updater artifact from the stapled app
        if: env.SIGNING == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        working-directory: src-tauri/target/release/bundle/macos
        run: |
          set -euo pipefail
          rm -f Wordwright.app.tar.gz Wordwright.app.tar.gz.sig
          tar -czf Wordwright.app.tar.gz Wordwright.app
          npx tauri signer sign Wordwright.app.tar.gz

      - name: Patch the app inside the dmg
        env:
          SIGNING_IDENTITY: ${{ env.SIGNING == 'true' && env.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          set -euo pipefail
          dmg="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          hdiutil convert "$dmg" -format UDRW -o "$RUNNER_TEMP/wordwright-rw.dmg"
          hdiutil attach "$RUNNER_TEMP/wordwright-rw.dmg" -nobrowse
          trap 'hdiutil detach "/Volumes/Wordwright" -force || true' EXIT
          scripts/apply-macos-document-icon.sh "/Volumes/Wordwright/Wordwright.app"
          hdiutil detach "/Volumes/Wordwright"
          trap - EXIT
          rm -f "$RUNNER_TEMP/wordwright-final.dmg"
          hdiutil convert "$RUNNER_TEMP/wordwright-rw.dmg" -format UDZO \
            -o "$RUNNER_TEMP/wordwright-final.dmg"
          mv "$RUNNER_TEMP/wordwright-final.dmg" "$dmg"

      - name: Sign the dmg
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          dmg="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          codesign --verify --strict "$dmg"

      - name: Notarize and staple the dmg
        if: env.SIGNING == 'true'
        env:
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8_B64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          dmg="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json \
            > "$RUNNER_TEMP/notary-dmg.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-dmg.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Verify Gatekeeper acceptance
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          dmg="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          spctl -a -vv --type install "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly
          trap 'hdiutil detach "/Volumes/Wordwright" -force || true' EXIT
          spctl -a -vv "/Volumes/Wordwright/Wordwright.app"
          hdiutil detach "/Volumes/Wordwright"
          trap - EXIT

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-dist
          cp src-tauri/target/release/bundle/dmg/*.dmg release-dist/
          if compgen -G "src-tauri/target/release/bundle/macos/*.app.tar.gz" > /dev/null; then
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz release-dist/
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig release-dist/
          fi
          ls -l release-dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: macos
          path: release-dist/*
          if-no-files-found: error

      - name: Attest signed macOS artifacts
        if: env.SIGNING == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-dist/*.dmg
            release-dist/*.app.tar.gz
            release-dist/*.app.tar.gz.sig

  windows-x64:
    name: Windows x64 build, sign
    needs: guard
    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SIGNING: ${{ github.event_name == 'push' || inputs.sign }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build (plain — updater key never touches the build step)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        if: env.SIGNING == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_TS_PROFILE }}
          files-folder: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify the signature
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne "Valid") { throw "invalid signature: $($sig.Status) $($sig.StatusMessage)" }
          $sig.SignerCertificate.Subject

      - name: Build the stored updater zip from the signed installer
        if: env.SIGNING == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1
          New-Item -ItemType Directory -Force release-dist | Out-Null
          $zip = "release-dist/Wordwright_${env:VERSION}_x64-setup.nsis.zip"
          python -c "import sys, zipfile, os; z = zipfile.ZipFile(sys.argv[2], 'w', zipfile.ZIP_STORED); z.write(sys.argv[1], os.path.basename(sys.argv[1])); z.close()" $exe.FullName $zip
          Copy-Item $exe.FullName release-dist/

      - name: Tauri-sign the updater zip
        if: env.SIGNING == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: pwsh
        run: |
          Get-ChildItem release-dist/*.nsis.zip | ForEach-Object {
            npx tauri signer sign $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($_.Name)" }
          }

      - name: Collect the unsigned build (dry run)
        if: env.SIGNING != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-dist | Out-Null
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1
          Copy-Item $exe.FullName release-dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: windows-x64
          path: release-dist/*
          if-no-files-found: error

      - name: Attest signed Windows x64 artifacts
        if: env.SIGNING == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-dist/*

  windows-arm64:
    name: Windows arm64 build
    needs: guard
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - run: npm ci
      - run: npm run tauri build -- --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: windows-arm64-unsigned
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  windows-arm64-sign:
    name: Windows arm64 sign (x64 runner — the signing action has no arm64 support)
    needs: [guard, windows-arm64]
    # Signing is required for a shippable installer; unsigned dry runs are
    # still exercised by the windows-arm64 build job above.
    if: >-
      github.event_name == 'push' ||
      (github.ref == 'refs/heads/main' && inputs.sign)
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5
        with:
          name: windows-arm64-unsigned
          path: unsigned

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_TS_PROFILE }}
          files-folder: unsigned
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify, zip, and Tauri-sign
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $exe = Get-ChildItem "unsigned/*-setup.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne "Valid") { throw "invalid signature: $($sig.Status)" }
          New-Item -ItemType Directory -Force release-dist | Out-Null
          Copy-Item $exe.FullName release-dist/
          $zip = "release-dist/Wordwright_${env:VERSION}_arm64-setup.nsis.zip"
          python -c "import sys, zipfile, os; z = zipfile.ZipFile(sys.argv[2], 'w', zipfile.ZIP_STORED); z.write(sys.argv[1], os.path.basename(sys.argv[1])); z.close()" $exe.FullName $zip
          npx tauri signer sign $zip
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: windows-arm64
          path: release-dist/*
          if-no-files-found: error

      - name: Attest signed Windows arm64 artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-dist/*

  sbom:
    name: SBOMs
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate and validate SBOMs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: >-
          ./scripts/generate-sbom.sh "$VERSION"
          macos-aarch64 windows-x86_64 windows-aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
      - name: Attest SBOMs
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: sbom/*.cdx.json

  release:
    name: Assemble and publish GitHub release
    needs: [guard, macos, windows-x64, windows-arm64-sign, sbom]
    if: github.ref_type == 'tag' || inputs.create_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5
        with:
          name: macos
          path: release-dist/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5
        with:
          name: windows-x64
          path: release-dist/windows-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5
        with:
          name: windows-arm64
          path: release-dist/windows-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5
        with:
          name: sbom
          path: release-dist/sbom

      - name: Build latest.json
        run: |
          set -euo pipefail
          ./scripts/generate-latest-json.sh "$VERSION" \
            "darwin-aarch64=release-dist/macos/Wordwright.app.tar.gz.sig" \
            "windows-x86_64=release-dist/windows-x64/Wordwright_${VERSION}_x64-setup.nsis.zip.sig" \
            "windows-aarch64=release-dist/windows-arm64/Wordwright_${VERSION}_arm64-setup.nsis.zip.sig" \
            > release-dist/latest.json
          jq . release-dist/latest.json

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create draft release
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$tag" = "v$VERSION" || { echo "::error::not a release tag: $tag"; exit 1; }
          # A hyphenated tag (v1.0.2-rc1) is a prerelease: it never becomes
          # releases/latest, so a validation run can't be offered to users.
          prerelease=()
          case "$tag" in *-*) prerelease=(--prerelease) ;; esac
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --draft --verify-tag "${prerelease[@]}" \
              --title "Wordwright $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload release assets
        run: gh release upload "$GITHUB_REF_NAME" release-dist/latest.json release-dist/*/* --clobber

      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
